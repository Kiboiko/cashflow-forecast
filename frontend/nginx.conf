# Журнал без параметров запроса (§10): в них бывают ИНН и текст поиска по операциям, а их не логируем нигде, как и в API.
# $uri — путь без параметров. Стандартный формат пишет $request целиком, и поиск «?q=…» попадал бы в docker compose logs web.
log_format kassa '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log kassa;
    # На уровне error nginx пишет строку запроса целиком (с параметрами), поэтому ошибки апстрима не пишем: смотрите docker compose logs api
    error_log /var/log/nginx/error.log crit;

    # Заголовки безопасности (§10)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 20m;   # выписки и CSV счетов

    # DNS Docker: имя api заново резолвится каждые 10 секунд — перезапуск контейнера api не ломает прокси (иначе 502)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # API и Swagger: запросы идут в контейнер api. X-Forwarded-For перезаписываем, чтобы клиент не подделал адрес для лимита входа.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    # Swagger тянет скрипты с CDN, поэтому CSP фронта сюда не применяем (свой add_header отключает унаследованные)
    location = /docs {
        proxy_pass $api_upstream;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /openapi.json {
        proxy_pass $api_upstream;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Статика с хэшами в именах — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: любой путь отдаёт index.html, иначе прямые ссылки (/payments) дают 404
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
