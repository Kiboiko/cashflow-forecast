# Запуск для жюри:  docker compose up --build   →  http://localhost:8080
# Демо-данные:      make seed  (нужен датасет в data/raw, см. README)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kassa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kassa-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-kassa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kassa} -d ${POSTGRES_DB:-kassa}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kassa}:${POSTGRES_PASSWORD:-kassa-dev-password}@db:5432/${POSTGRES_DB:-kassa}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-env-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      DEMO_MODE: ${DEMO_MODE:-true}
      FORECAST_MODE: ${FORECAST_MODE:-engine}
      TRUST_PROXY_HEADERS: "true"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      UPLOAD_DIR: /tmp/kassa-uploads
    volumes:
      - ./data:/data:ro
      - uploads:/tmp/kassa-uploads
    depends_on:
      db:
        condition: service_healthy
    # Порт API наружу не публикуем: всё идёт через nginx (web), который сам выставляет X-Forwarded-For.
    # Иначе лимит попыток входа обходился бы подменой этого заголовка. Swagger: http://localhost:8080/docs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  uploads:
