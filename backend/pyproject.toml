[project]
name = "kassa-radar"
version = "0.1.0"
description = "Кассовый радар — прогноз остатка и кассовых разрывов для малого бизнеса"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "pydantic>=2.7",
    # сервис (человек B): API, БД, вход
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["ISC004", "PLC0206"]          # отчётные скрипты: форматирование текста важнее стиля
